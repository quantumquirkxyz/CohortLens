# fly.toml app configuration file generated for cohortlens-lgsoda on 2026-08-16T19:23:13Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'cohortlens-lgsoda'
primary_region = 'dfw'

[build]
  dockerfile = 'docker/Dockerfile.api'

[env]
  NODE_ENV = 'production'
  PORT = '8000'
  TRUST_PROXY = '1'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '3s'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
