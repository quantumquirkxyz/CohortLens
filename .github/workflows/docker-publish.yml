name: Publish Docker images

# Builds and publishes the production images (api, web, indexer, migrate) to
# GHCR on every push to main, so container hosts (Fly.io, Render, VPS) can pull
# them directly. See docs/deploy.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: docker/Dockerfile.api
          - name: web
            dockerfile: docker/Dockerfile.web
          - name: indexer
            dockerfile: docker/Dockerfile.indexer
          - name: migrate
            dockerfile: docker/Dockerfile.migrate
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR requires lowercase repository names; github.repository may contain
      # uppercase (e.g. quantumquirkxyz/CohortLens).
      - name: Lowercase image repository
        run: echo "IMAGE_REPOSITORY=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/${{ matrix.name }}:latest
            ghcr.io/${{ env.IMAGE_REPOSITORY }}/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
