specVersion: 0.0.4
description: CohortLens Capital Flow Graph events (prototype interface)
repository: https://github.com/quantumquirkxyz/CohortLens
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: CFGEvents
    network: mainnet
    source:
      # Placeholder: any contract emitting the CFGEvents interface. On real
      # deployment, point this at the deployed protocol contract(s) and set
      # the correct startBlock per chain (ADR 006, Fase 6 deferred).
      address: "0x0000000000000000000000000000000000000001"
      abi: CFGEvents
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - Wallet
        - Pool
        - Asset
        - Chain
        - Protocol
        - CapitalFlow
      abis:
        - name: CFGEvents
          file: ./abis/CFGEvents.json
      eventHandlers:
        - event: Deposit(indexed address,indexed address,address,uint256)
          handler: handleDeposit
        - event: Borrow(indexed address,indexed address,address,uint256)
          handler: handleBorrow
        - event: Repay(indexed address,indexed address,address,uint256)
          handler: handleRepay
        - event: Withdraw(indexed address,indexed address,address,uint256)
          handler: handleWithdraw
        - event: Swap(indexed address,indexed address,address,address,uint256,uint256)
          handler: handleSwap
        - event: Transfer(indexed address,indexed address,address,uint256)
          handler: handleTransfer
      file: ./src/mapping.ts
